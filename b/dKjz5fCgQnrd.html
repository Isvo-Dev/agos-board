<script>(async()=>{try{const k=(location.hash.match(/[#&]k=([\w-]+)/)||[])[1];if(!k)throw Error('this link has no key; open it from the Checkins bot');
const b=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0)),raw=b(document.getElementById('ct').textContent.trim());
const key=await crypto.subtle.importKey('raw',b(k),'AES-GCM',false,['decrypt']);
const page=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(0,12)},key,raw.slice(12)));
